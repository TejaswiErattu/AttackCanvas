# Repositories the evaluation runner analyses (scripts/eval/run.ts).
#   name: file-safe id; becomes eval/results/<name>.json, eval/labels/<name>.csv
#         and eval/expected/<name>.yaml (lowercase letters, digits, hyphens).
#   url:  public GitHub repo URL, e.g. https://github.com/<owner>/<repo>
repos:
  - name: testbed # Jasnoor's project
    url: ""
  - name: nodegoat # OWASP/NodeGoat
    # Pinned to the commit the answer key was drafted from. The pipeline passes the
    # /tree/<ref> segment to the loader and records it as threatModel.repo.ref.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-after-fix # OWASP/NodeGoat again, after fixes d2ec8b7 + d21360d
    # Same pinned commit as "nodegoat", so the two results differ only by AttackCanvas
    # changes. Scored against eval/expected/nodegoat-after-fix.yaml, a byte-identical
    # copy of the nodegoat draft key.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-7f7211d # OWASP/NodeGoat again, at AttackCanvas 7f7211d (targeted Semgrep rules + handler/DAO/startup windows)
    # Same pinned commit as "nodegoat-after-fix"; differs only by AttackCanvas changes in 7f7211d.
    # Scored against eval/expected/nodegoat-7f7211d.yaml, a byte-identical copy of the draft key.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-7a0fb27 # OWASP/NodeGoat again, at AttackCanvas 7a0fb27 (live-use header and CSRF detectors)
    # Same pinned commit; differs from nodegoat-7f7211d (run at c8dd73f) only by 7a0fb27.
    # Scored against eval/expected/nodegoat-7a0fb27.yaml, a byte-identical copy of the draft key.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-f64cfa8 # OWASP/NodeGoat again, at AttackCanvas f64cfa8 (CWE-scoped gap floor)
    # Same pinned commit; differs from nodegoat-7a0fb27 by f64cfa8 only.
    # Scored against eval/expected/nodegoat-f64cfa8.yaml, a byte-identical copy of the draft key.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-a3118b6 # OWASP/NodeGoat again, at AttackCanvas a3118b6 (session-cookie facts + threats.v2 prompt)
    # Same pinned commit; differs from nodegoat-f64cfa8 by b956a3f (same-line evidence rule) and a3118b6.
    # Scored against eval/expected/nodegoat-a3118b6.yaml, a byte-identical copy of the draft key.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-a6ef3ec # OWASP/NodeGoat again, at AttackCanvas a6ef3ec (reader-facing limitations and findings)
    # Same pinned commit; differs from nodegoat-a3118b6 by the diagram work (592bc44..889d674),
    # 7d83ed1 (limitations split from diagnostics) and a6ef3ec (finding wording, prompt rule).
    # Scored against eval/expected/nodegoat-a6ef3ec.yaml, a byte-identical copy of the draft key.
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  # Consistency runs (scripts/eval/consistency.ts). All at the pinned commit c5cb68a and all
  # run with the pipeline at AttackCanvas 535a19d (Prompt H, the level plans) and the I-1
  # eval harness committed on top of it, which changes no pipeline code. r1-r3 repeat
  # level 2; l0 and l1 vary only the level.
  - name: nodegoat-final-r1 # OWASP/NodeGoat, level 2, AttackCanvas 535a19d
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-final-r2 # OWASP/NodeGoat, level 2, AttackCanvas 535a19d
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-final-r3 # OWASP/NodeGoat, level 2, AttackCanvas 535a19d
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-final-l0 # OWASP/NodeGoat, level 0, AttackCanvas 535a19d
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
  - name: nodegoat-final-l1 # OWASP/NodeGoat, level 1, AttackCanvas 535a19d
    url: "https://github.com/OWASP/NodeGoat/tree/c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
